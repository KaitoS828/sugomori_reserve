name: Supabase Keepalive

# 無料プランの自動一時停止（無操作が続くと停止）を防ぐため、
# 2日おきに実クエリを1回投げてアクティビティを発生させる。
on:
  schedule:
    - cron: "17 2 */2 * *" # 2日おき 02:17 UTC（=11:17 JST）
  workflow_dispatch: {} # 手動実行も可

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to keep project active
        env:
          SUPABASE_URL: https://kzfhhcnylqlsvnqetgep.supabase.co
          # anon（公開）キー。NEXT_PUBLIC_ でブラウザに配布されるキーと同一で、
          # 秘匿情報ではない（アクセス制御は RLS が担保）。keepalive 専用途。
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6ZmhoY255bHFsc3ZucWV0Z2VwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMTg5NTYsImV4cCI6MjA5Nzg5NDk1Nn0.OwMmHAj-FQUpt0xJC4CtsucExtbNkGcPoLYBe-eazc4
        run: |
          echo "Pinging Supabase REST API..."
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/plans?select=id&limit=1")
          echo "HTTP ${code}"
          head -c 300 /tmp/resp.txt; echo
          if [ "${code}" != "200" ]; then
            echo "::error::Supabase returned HTTP ${code} (expected 200). Project may be paused or misconfigured."
            exit 1
          fi
          echo "OK: project is active."
